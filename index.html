<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BVOS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BVOS">
<meta name="theme-color" content="#f6f5f4">
<style>
:root {
  --canvas:#f5f7fa; --surface:rgba(255,255,255,.68); --solid:#fff; --well:rgba(120,135,155,.08);
  --text:#1c2430; --muted:#626e7d; --line:rgba(120,135,155,.18); --inner:rgba(255,255,255,.8);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.1); --green:#24834b; --orange:#a85b00; --red:#c32d36;
  --red-soft:rgba(210,45,55,.09); --wash:rgba(0,122,255,.09); --shadow:0 8px 32px rgba(30,50,80,.045);
  --green-soft:rgba(36,131,75,.1); --orange-soft:rgba(168,91,0,.1);
  --radius:18px; --radius-sm:10px; --shadow-card:var(--shadow); --text-strong:var(--text); --danger-text:var(--red);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark) {
  :root { --canvas:#101318; --surface:rgba(30,35,43,.72); --solid:#1e232b; --well:rgba(180,195,215,.07);
    --text:#f1f4f8; --muted:#a5afbc; --line:rgba(185,200,220,.16); --inner:rgba(255,255,255,.09);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --green:#66d18b; --orange:#ffb457; --red:#ff858d;
    --red-soft:rgba(255,80,95,.12); --wash:rgba(10,132,255,.07); --shadow:0 8px 32px rgba(0,0,0,.16); color-scheme:dark;
    --green-soft:rgba(102,209,139,.13); --orange-soft:rgba(255,180,87,.13); }
}
* { box-sizing:border-box; }
body { margin:0; color:var(--text); background:radial-gradient(ellipse at 70% 0,var(--wash),transparent 65%),var(--canvas); font-size:17px; line-height:1.5; min-height:100vh; }
button,a,summary { -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; cursor:pointer; }
a { color:var(--accent); text-underline-offset:3px; }
button:active,summary:active,.tap:active { transform:scale(.97); }
button,summary,.tap { transition:transform 150ms ease-out,background 150ms ease-out; }
:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
[hidden] { display:none !important; }
.wrap { min-height:100vh; }
.sidebar,.card,.tile,.tabs { background:var(--surface); border:1px solid var(--inner); box-shadow:var(--shadow); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); }
.sidebar { position:fixed; inset:0 auto 0 0; width:236px; padding:40px 20px 24px; display:flex; flex-direction:column; border-width:0 1px 0 0; z-index:10; }
.brand { padding:0 16px; font-size:23px; font-weight:750; letter-spacing:-.05em; }
.tabs { position:relative; display:flex; flex-direction:column; margin-top:44px; border:0; box-shadow:none; background:transparent; border-radius:12px; }
.tab { position:relative; z-index:1; display:flex; align-items:center; gap:12px; width:100%; height:50px; padding:0 16px; border:0; border-radius:12px; background:transparent; text-align:left; color:var(--muted); font-size:15px; font-weight:550; }
.tab[aria-selected="true"] { color:var(--accent); }
.tab:hover { background:var(--well); }
.tab svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
#tab-marker { position:absolute; left:0; top:0; width:100%; height:50px; background:var(--accent-soft); border-radius:12px; transform:translateY(calc(var(--index,0) * 50px)); transition:transform 250ms ease-in-out; pointer-events:none; }
.sidebar-footer { margin-top:auto; padding:28px 16px 0; color:var(--muted); font-size:13px; }
#status { margin-top:6px; }
main { margin-left:236px; padding:48px clamp(24px,4vw,64px) 64px; max-width:1600px; }
.page-head { margin-bottom:28px; }
h1 { font-size:34px; line-height:1.2; letter-spacing:-.04em; margin:0; font-weight:750; }
.panels { display:grid; align-items:start; }
.panel { grid-area:1 / 1; min-width:0; }
.panel.leaving { pointer-events:none; }
.content-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.card { border-radius:18px; padding:24px; min-width:0; overflow-wrap:anywhere; }
.wide { grid-column:1 / -1; }
.card-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:20px; }
.card-title { font-size:17px; font-weight:650; }
.card-sub,.secondary,.muted,.empty { font-size:13px; color:var(--muted); }
.metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; grid-column:1 / -1; }
.metrics.has-weather { grid-template-columns:repeat(4,minmax(0,1fr)); }
.weather-tile .figure-num { font-size:32px; display:flex; align-items:center; gap:8px; }
.weather-tile .weather-icon { width:32px; height:32px; }
.weather-tile .metric-label { font-size:12px; margin-top:3px; }
.weather-tile .weather-hilow { font-size:13px; font-weight:600; margin-top:4px; color:var(--text); }
.weather-tile .weather-marks,.weather-tile .weather-extras { font-size:11px; margin-top:4px; color:var(--muted); line-height:1.3; }
.weather-tile .weather-alert { font-size:11px; margin-top:4px; color:var(--orange); line-height:1.3; }
.weather-tile .weather-warn { color:var(--orange); }
.weather-tile .weather-credit { font-size:10px; margin-top:6px; color:var(--muted); opacity:.75; }
.weather-icon { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.day-weather { display:flex; align-items:center; gap:6px; margin-top:4px; font-weight:400; font-size:12px; color:var(--muted); }
.tile { border-radius:18px; padding:20px; min-width:0; overflow-wrap:anywhere; }
.figure-num { font-size:38px; font-weight:700; letter-spacing:-.05em; line-height:1.2; }
.figure-unit { font-size:13px; color:var(--muted); margin-left:6px; }
.metric-label { display:block; margin-top:6px; color:var(--muted); font-size:13px; }
.lead { padding:4px 0 18px; }
.lead-title { font-size:26px; line-height:1.3; font-weight:650; letter-spacing:-.025em; margin:10px 0; }
.tag { color:var(--accent); font-size:13px; font-weight:550; }
.rows,.list { list-style:none; padding:0; margin:0; }
.item,.row { padding:14px 0; border-top:1px solid var(--line); }
.item { display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
.item-name { min-width:0; }
.item-value { color:var(--muted); font-size:13px; text-align:right; }
.row { display:grid; grid-template-columns:70px minmax(0,1fr); gap:4px 16px; }
.row-detail { grid-column:2; font-size:13px; color:var(--muted); }
.sub-head { font-size:13px; font-weight:550; color:var(--muted); margin:20px 0 10px; }
.grade { padding:14px 0; border-top:1px solid var(--line); }
.grade-label { display:flex; justify-content:space-between; gap:16px; margin-bottom:10px; }
.grade-bar { height:6px; border-radius:9px; background:var(--well); overflow:hidden; }
.grade-bar i { display:block; height:100%; background:var(--accent); border-radius:inherit; }
.day { display:grid; grid-template-columns:120px minmax(0,1fr); gap:18px; padding:18px 0; border-top:1px solid var(--line); }
.day-label { font-weight:600; font-size:13px; }
.event { display:grid; grid-template-columns:80px minmax(0,1fr); gap:12px; padding:6px 0; }
.event-time,.event-where { color:var(--muted); font-size:13px; }
.event-title { font-weight:500; }
.free { color:var(--muted); font-size:13px; padding:6px 0; }
.stages { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
.stage { background:var(--well); padding:12px 8px; border-radius:12px; text-align:center; }
.stage b { display:block; font-size:24px; }
.stage span { font-size:13px; color:var(--muted); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:10px; flex:none; }
.dot[data-down="true"] { background:var(--red); }
.tab[data-alert="true"]::after { content:""; position:absolute; top:12px; left:32px; width:8px; height:8px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 2px var(--solid); pointer-events:none; }
#builds { margin-bottom:18px; }
.build { align-items:center; }
.build-num { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; margin-right:4px; }
.build-meta { display:flex; align-items:center; gap:10px; flex:none; font-size:13px; color:var(--muted); white-space:nowrap; }
.pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; line-height:1.6; background:var(--well); color:var(--muted); }
.pill[data-state="merged"] { background:var(--green-soft); color:var(--green); }
.pill[data-state="building"],.pill[data-state="waiting-for-checks"] { background:var(--accent-soft); color:var(--accent); }
.pill[data-state="waiting-for-ben"] { background:var(--orange-soft); color:var(--orange); }
.pill[data-state="parked"] { background:var(--red-soft); color:var(--red); }
.build .secondary { margin-top:2px; }
.builders { border-top:1px solid var(--line); padding-top:12px; }
.builder { margin:0; font-size:13px; color:var(--muted); }
.banner { padding:14px 18px; border-radius:14px; margin-bottom:24px; background:var(--well); font-size:13px; }
button.banner { display:block; width:100%; text-align:left; border:1px solid var(--red); background:var(--red-soft); color:var(--red); }
.deadline[data-today="true"] { border-left:3px solid var(--orange); padding-left:14px; }
.deadline[data-today="true"] summary { color:var(--orange); }
details { border-top:1px solid var(--line); padding:16px 0; }
summary { cursor:pointer; font-size:17px; font-weight:550; }
summary span { display:block; color:var(--muted); font-size:13px; font-weight:400; margin-top:4px; }
details p { margin:14px 0 0; font-size:13px; color:var(--muted); }
.apply { display:inline-block; text-decoration:none; background:var(--accent-soft); border-radius:10px; padding:8px 14px; margin-top:14px; font-size:13px; font-weight:600; }
.rotation { display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; }
.rotation span { border-radius:12px; background:var(--well); padding:10px 16px; font-size:13px; }
.rotation .next { background:var(--accent-soft); color:var(--accent); }
#agents-card { margin-bottom:18px; }
.agents-line { grid-column:1 / -1; margin:0; font-size:13px; color:var(--muted); }
.agents-hero { grid-column:1 / -1; padding:0 0 4px; }
.agents-sentence { margin:0; font-size:26px; line-height:1.3; font-weight:650; letter-spacing:-.025em; }
.agents-silent { margin:8px 0 0; font-size:13px; color:var(--muted); }
.lanes { grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
.lane { display:flex; flex-direction:column; gap:12px; }
.lane .card-head { margin-bottom:0; align-items:center; }
.lane-name { font-size:17px; font-weight:650; }
.lane-task { display:flex; flex-direction:column; gap:2px; padding-top:12px; border-top:1px solid var(--line); }
.lane-task:first-of-type { border-top:0; padding-top:0; }
.what { font-size:13px; color:var(--muted); }
.doing { margin-top:2px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lane-foot { font-size:13px; color:var(--muted); margin-top:auto; }
.sessions { list-style:none; margin:0; padding:12px 0 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.session { font-size:13px; color:var(--muted); display:flex; align-items:baseline; }
.session .dot { margin-right:8px; }
.dot[data-state="idle"] { background:var(--muted); }
.chip { display:inline-block; padding:1px 8px; border-radius:8px; font-size:12px; background:var(--well); color:var(--muted); white-space:nowrap; }
.chip.merge { background:var(--orange-soft); color:var(--orange); }
.run-btn { border:1px solid var(--line); background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:6px 14px; font-size:13px; font-weight:600; }
.run-btn:disabled { opacity:.5; cursor:default; }
.run-note { margin-right:10px; font-size:13px; color:var(--muted); }
.card-head .run-box { display:flex; align-items:center; }
.pill[data-state="ready"],.pill[data-state="green"] { background:var(--green-soft); color:var(--green); }
.pill[data-state="out"],.pill[data-state="running"] { background:var(--orange-soft); color:var(--orange); }
.pill[data-state="red"] { background:var(--red-soft); color:var(--red); }
.ring { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:ring-turn 3s linear infinite; }
@keyframes ring-turn { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
@keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.panel.entering .card,.panel.entering .tile { animation:enter 280ms ease-out both; animation-delay:calc(var(--order,0) * 30ms); }
@keyframes green-pulse { 50% { background:rgba(60,190,100,.16); } }
.turned-green { animation:green-pulse 650ms ease-out 1; }
@supports not ((backdrop-filter:blur(24px)) or (-webkit-backdrop-filter:blur(24px))) {
  .sidebar,.card,.tile,.tabs { background:var(--solid); }
}
@media (min-width:900px) {
  body { height:100vh; height:100dvh; overflow:hidden; }
  .sidebar { height:100vh; height:100dvh; }
  main { height:100vh; height:100dvh; overflow-y:auto; }
}
@media (max-width:899px) {
  .sidebar { position:static; width:auto; padding:22px 20px 0; border:0; background:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .brand { padding:0; font-size:20px; }
  .sidebar-footer { position:absolute; right:20px; top:23px; padding:0; margin:0; text-align:right; font-size:13px; }
  #date { display:none; }
  #status { margin:0; }
  /* The static phone sidebar cannot lift its fixed tabs above glass cards. */
  .tabs { position:fixed; z-index:10; bottom:calc(12px + env(safe-area-inset-bottom,0px)); left:12px; right:12px; flex-direction:row; margin:0; padding:5px; border:1px solid var(--inner); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); }
  .tab { flex:1; width:0; height:58px; padding:5px 0; flex-direction:column; justify-content:center; gap:3px; font-size:10px; border-radius:17px; }
  #tab-marker { left:5px; top:5px; width:calc((100% - 10px) / var(--tabs,6)); height:58px; transform:translateX(calc(var(--index,0) * 100%)); border-radius:17px; }
  .tab[data-alert="true"]::after { top:9px; left:calc(50% + 5px); }
  #builds { margin-bottom:14px; }
  main { margin:0; padding:32px 20px calc(112px + env(safe-area-inset-bottom,0px)); }
  h1 { font-size:28px; }
  .page-head { margin-bottom:24px; }
  .content-grid { grid-template-columns:minmax(0,1fr); gap:14px; }
  .lanes { grid-template-columns:minmax(0,1fr); gap:14px; }
  .agents-sentence { font-size:23px; }
  .card { padding:20px; }
  .metrics { gap:8px; }
  .metrics.has-weather { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .tile { padding:14px 10px; }
  .figure-num { font-size:30px; }
  .weather-tile .weather-icon { width:30px; height:30px; }
  .figure-unit { display:block; margin-left:0; }
  .metric-label { font-size:12px; }
  .day { grid-template-columns:minmax(0,1fr); gap:8px; }
  .item { flex-wrap:wrap; gap:4px 12px; }
  .item-value { text-align:left; }
  .lead-title { font-size:23px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  ::view-transition-old(root),::view-transition-new(root) { animation:none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar" aria-label="BVOS navigation">
    <div class="brand">BVOS</div>
    <div class="tabs" id="tablist" role="tablist" aria-label="Life areas" aria-orientation="vertical">
      <div id="tab-marker" aria-hidden="true"></div>
      <button class="tab" id="tab-today" role="tab" data-tab="today" aria-controls="panel-today" aria-selected="true" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Today</span></button>
      <button class="tab" id="tab-agents" data-tab="agents" aria-controls="panel-agents" aria-selected="false" tabindex="-1" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4m-3 8h.01M15 12h.01M9 16h6"/></svg><span>Agents</span></button>
      <button class="tab" id="tab-school" role="tab" data-tab="school" aria-controls="panel-school" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3zM12 6v15"/></svg><span>School</span></button>
      <button class="tab" id="tab-career" role="tab" data-tab="career" aria-controls="panel-career" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V3h8v4M3 12l9 3 9-3M10 14v3h4v-3"/></svg><span>Career</span></button>
      <button class="tab" id="tab-health" role="tab" data-tab="health" aria-controls="panel-health" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C-5 10 5-2 12 7c7-9 17 3 0 14z"/></svg><span>Health</span></button>
      <button class="tab" id="tab-calendar" role="tab" data-tab="calendar" aria-controls="panel-calendar" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18M7 14h3m4 0h3m-10 4h3"/></svg><span>Calendar</span></button>
      <button class="tab" id="tab-system" role="tab" data-tab="system" aria-controls="panel-system" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></svg><span>System</span></button>
    </div>
    <div class="sidebar-footer"><div id="date"></div><div id="status" aria-live="polite"></div></div>
  </aside>
  <main>
    <div id="banner" aria-live="polite"></div>
    <div class="panels">
      <section class="panel" id="panel-today" role="tabpanel" aria-labelledby="tab-today" tabindex="0"><header class="page-head"><h1>Today</h1></header><div class="content-grid" id="today"></div></section>
      <section class="panel" id="panel-agents" role="tabpanel" aria-labelledby="tab-agents" tabindex="0" hidden><header class="page-head"><h1>Agents</h1></header><div class="content-grid" id="agents"></div></section>
      <section class="panel" id="panel-school" role="tabpanel" aria-labelledby="tab-school" tabindex="0" hidden><header class="page-head"><h1>School</h1></header><div class="content-grid" id="school"></div></section>
      <section class="panel" id="panel-career" role="tabpanel" aria-labelledby="tab-career" tabindex="0" hidden><header class="page-head"><h1>Career</h1></header><div class="content-grid" id="career"></div></section>
      <section class="panel" id="panel-health" role="tabpanel" aria-labelledby="tab-health" tabindex="0" hidden><header class="page-head"><h1>Health</h1></header><div class="content-grid" id="health"></div></section>
      <section class="panel" id="panel-calendar" role="tabpanel" aria-labelledby="tab-calendar" tabindex="0" hidden><header class="page-head"><h1>Calendar</h1></header><div class="content-grid" id="calendar"></div></section>
      <section class="panel" id="panel-system" role="tabpanel" aria-labelledby="tab-system" tabindex="0" hidden><header class="page-head"><h1>System</h1></header><div class="card builds" id="builds" hidden></div><div class="card builds" id="agents-card" hidden></div><div class="card board" id="board"></div></section>
    </div>
  </main>
</div>
<script>window.BVOS_APP = true;</script>
<script>
(function () {
  "use strict";
  var REFRESH_MS = 5 * 60 * 1000;
  var areas = ["today", "agents", "school", "career", "health", "calendar", "system"];
  var active = null, previousStatus = {};
  var agentsFeed = null, agentsLive = false, hubSilent = false, runNote = '', agentsHtml = '', agentsTimer = null;
  function tabHidden(id) { var tab = document.getElementById('tab-' + id); return !tab || !!tab.hidden; }
  function visibleAreas() { return areas.filter(function (area) { return !tabHidden(area); }); }
  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c];
    });
  }

        '<span class="build-meta"><span class="pill" data-state="' + esc(key.replace(/\s+/g, '-')) + '">' + esc(BUILD_STATES[key] || cap(key) || 'Unknown') + '</span>' +
        '<span class="build-time">' + esc(t.when || '') + '</span></span></li>';
    }).join('');
    var lines = builders.map(function(b) {
      var line = b.line || (cap(String(b.name || 'Builder')) + ' ' + (stateKey(b.state) || 'out'));
      return '<p class="builder">' + esc(line) + '</p>';
    }).join('');
    cardEl.innerHTML = head('Builds', waiting ? (waiting === 1 ? '1 needs you' : waiting + ' need you') : '') +
      (rows ? '<ul class="list">' + rows + '</ul>' : empty('No builds yet.')) + (lines ? '<div class="builders">' + lines + '</div>' : '');
  }
  // ---- Agents: who's building what (the tab is Mac-hub only; the System card is the short copy) ----
  var LABELS = {'codex':'Codex', 'antigravity':'Antigravity', 'antigravity-key':'Antigravity', 'claude':'Claude Code'};
  function objects(list) { return Array.isArray(list) ? list.filter(function (x) { return x && typeof x === 'object'; }) : []; }
  function builderName(text) {
    var raw = String(text == null ? '' : text).trim(), only = /\sonly$/.test(raw);
    var names = raw.replace(/\s+only$/, '').split(',').map(function (n) { n = n.trim(); return LABELS[n] || n; }).filter(Boolean);
    return names.join(', ') + (only && names.length ? ' only' : '');
  }
  // Feed times are Chicago wall-clock ISO strings, so they are read as written.
  function parts(iso) {
    var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(String(iso == null ? '' : iso));
    return m ? {y:+m[1], mo:+m[2], d:+m[3], h:+m[4], mi:+m[5], day:m[1] + '-' + m[2] + '-' + m[3]} : null;
  }
  function wallClock(p) { return (p.h % 12 || 12) + ':' + (p.mi < 10 ? '0' : '') + p.mi + (p.h < 12 ? ' am' : ' pm'); }
  function weekday(p) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(p.y, p.mo - 1, p.d)).getUTCDay()]; }
  function whenLabel(iso, refIso) {
    var p = parts(iso), r = parts(refIso);
    if (!p) return '';
    return (r && r.day !== p.day ? weekday(p) + ' ' : '') + wallClock(p);
  }
  function minutesBetween(a, b) {
    var p = parts(a), q = parts(b);
    return p && q ? Math.round((Date.UTC(q.y, q.mo - 1, q.d, q.h, q.mi) - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi)) / 60000) : null;
  }
  function ago(minutes) {
    if (minutes == null) return '';
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + ' min ago';
    if (minutes < 1440) return Math.floor(minutes / 60) + ' h ago';
    return Math.floor(minutes / 1440) + ' d ago';
  }
  function sentence() { return agentsFeed && agentsFeed.left && agentsFeed.left.line ? String(agentsFeed.left.line) : ''; }
  function whatLine(text) { return text ? '<div class="what">' + esc(text) + '</div>' : ''; }
  function numbered(number, title) { return '<span class="build-num">' + esc(number) + '</span> ' + esc(title); }
  function prLink(value) {
    var url = safeLink(value), number = /\/pull\/(\d+)/.exec(url);
    return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + (number ? 'PR #' + number[1] : 'Pull request') + ' <span aria-hidden="true">↗</span></a>' : '';
  }
  function outText(lane, ref) { return 'Out' + (lane.back ? ' until ' + whenLabel(lane.back, ref) : ''); }
  function lanePill(lane, ref) {
    var state = stateKey(lane.state), key = state.replace(/\s+/g, '-');
    var text = state === 'building' ? '<i class="ring"></i>Building' : state === 'ready' ? 'Ready' : state === 'out' ? esc(outText(lane, ref))
      : state === 'off hours' ? 'Overnight only' : esc(cap(state) || 'Unknown');
    return '<span class="pill" data-state="' + esc(key) + '">' + text + '</span>';
  }
  function laneCard(lane, ref) {
    var tasks = objects(lane.now), body = '';
    if (tasks.length) {
      body += tasks.map(function (t) {
        var minutes = minutesBetween(t.started, ref);
        var line = [t.step ? cap(String(t.step)) : '', minutes == null ? '' : Math.max(0, minutes) + ' min', t.tries != null ? 'try ' + t.tries : '', t.model || ''].filter(Boolean).join(' · ');
        return '<div class="lane-task"><div>' + numbered(t.number, t.title) + '</div>' + whatLine(t.what) +
          (line ? '<div class="secondary">' + esc(line) + '</div>' : '') +
          (t.doing ? '<div class="doing" title="' + esc(t.doing) + '">' + esc(t.doing) + '</div>' : '') + '</div>';
      }).join('');
    } else body += '<div class="lane-task"><div class="muted">Nothing building</div>' + (lane.note ? '<div class="secondary">' + esc(lane.note) + '</div>' : '') + '</div>';
    if (Number(lane.merged_today) > 0) body += '<div class="lane-foot">' + esc(lane.merged_today) + ' merged today</div>';
    var sessions = lane.name === 'claude' ? objects(lane.sessions) : [];
    if (sessions.length) body += '<ul class="sessions">' + sessions.map(function (s) {
      var line = [s.title, s.model, s.effort, ago(minutesBetween(s.last, ref))].filter(Boolean).join(' · ');
      return '<li class="session"><i class="dot" data-state="' + (s.state === 'working' ? 'working' : 'idle') + '"></i>' + esc(line) + '</li>';
    }).join('') + '</ul>';
    return '<article class="card lane"><div class="card-head"><div class="lane-name">' + esc(lane.label || LABELS[lane.name] || lane.name) + '</div>' + lanePill(lane, ref) + '</div>' + body + '</article>';
  }
  function agentsHtmlFor(feed) {
    var ref = feed.updated, html = '<div class="agents-hero"><p class="agents-sentence">' + esc(sentence()) + '</p>' +
      (hubSilent ? '<p class="agents-silent">Hub not answering</p>' : '') + '</div>';
    var needs = objects(feed.needs_ben);
    if (needs.length) html += card('Needs you', '<ul class="list">' + needs.map(function (n) {
      var link = prLink(n.pr);
      return '<li class="item build"><div class="item-name">' + numbered(n.number, n.title) + whatLine(n.what) +
        '<div class="secondary">' + esc(n.why || n.state || '') + (link ? ' · ' + link : '') + '</div></div></li>';
    }).join('') + '</ul>', true);
    html += '<div class="lanes">' + objects(feed.lanes).map(function (lane) { return laneCard(lane, ref); }).join('') + '</div>';
    var queue = objects(feed.queue);
    var note = runNote ? '<span class="run-note">' + esc(runNote) + '</span>' : '';
    html += '<article class="card wide"><div class="card-head"><div class="card-title">Up next</div><div class="run-box">' + note +
      '<button class="run-btn" type="button" data-agents-run' + (queue.length ? '' : ' disabled') + '>Build now</button></div></div>' +
      (queue.length ? '<ul class="list">' + queue.map(function (q) {
        var chip = q.builder && q.builder !== 'any' ? builderName(q.builder) : '', waits = Array.isArray(q.waits_for) ? q.waits_for : [];
        return '<li class="item build"><div class="item-name">' + numbered(q.number, q.title) + whatLine(q.what) + '</div><span class="build-meta">' +
          (chip ? '<span class="chip">' + esc(chip) + '</span>' : '') +
          (waits.length ? '<span class="secondary">waits for ' + esc(waits.join(', ')) + '</span>' : '') +
          (/^ben/i.test(String(q.merge || '')) ? '<span class="chip merge">your merge</span>' : '') + '</span></li>';
      }).join('') + '</ul>' : empty('Nothing queued')) + '</article>';
    var done = objects(feed.done);
    html += card('Done', done.length ? '<ul class="list">' + done.map(function (d) {
      var link = prLink(d.pr);
      return '<li class="item build"><div class="item-name">' + numbered(d.number, d.title) + whatLine(d.what) + '</div><span class="build-meta">' +
        esc(LABELS[d.builder] || d.builder || '') + '<span>' + esc(whenLabel(d.time, ref)) + '</span>' + link + '</span></li>';
    }).join('') + '</ul>' : empty('Nothing merged yet'));
    var pulls = objects(feed.pulls), CHECKS = {green:'Green', red:'Red', running:'Running'};
    html += card('Open pull requests', pulls.length ? '<ul class="list">' + pulls.map(function (p) {
      var checks = String(p.checks || 'none');
      return '<li class="item build"><div class="item-name">' + numbered('#' + p.number, p.title) + '</div><span class="build-meta"><span class="pill" data-state="' + esc(checks) + '">' + esc(CHECKS[checks] || 'No checks') + '</span></span></li>';
    }).join('') + '</ul>' : empty('No open pull requests'));
    return html;
  }
  function drawAgents() {
    var tab = document.getElementById('tab-agents'), panel = document.getElementById('agents');
    if (tab) {
      tab.hidden = !agentsLive;
      if (agentsLive && tab.setAttribute) tab.setAttribute('role', 'tab');   // set here so the six always-there tabs stay the only static ones
    }
    if (!panel) return;
    if (!agentsLive) { panel.innerHTML = ''; agentsHtml = ''; if (active === 'agents') activate('today', false, false); return; }
    var html = agentsFeed ? agentsHtmlFor(agentsFeed) : '<div class="agents-hero"><p class="agents-sentence">Waiting for the hub</p>' + (hubSilent ? '<p class="agents-silent">Hub not answering</p>' : '') + '</div>';
    if (html !== agentsHtml) { agentsHtml = html; panel.innerHTML = html; }   // untouched when nothing changed, so the ring keeps turning
    var line = document.getElementById('agents-line');
    if (line) line.textContent = sentence();
  }
  function keyQuery() { var key = new URLSearchParams(location.search).get('key'); return key ? '?key=' + encodeURIComponent(key) : ''; }
  function pollAgents() {
    if (!agentsLive || active !== 'agents' || document.hidden || typeof fetch !== 'function') return;
    fetch('agents' + keyQuery(), {cache:'no-store'})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (feed) { agentsFeed = feed; hubSilent = false; drawAgents(); }, function () { hubSilent = true; drawAgents(); });
  }
  function setRunNote(text) {
    runNote = text; drawAgents();
    setTimeout(function () { runNote = ''; drawAgents(); }, 5000);
  }
  function runBuilds() {
    if (typeof fetch !== 'function') return;
    fetch('agents/run' + keyQuery(), {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
      .then(function (r) { setRunNote(r.ok ? 'Started' : r.status === 429 ? 'Try again in a minute' : 'Couldn’t start'); },
            function () { setRunNote('Try again in a minute'); });
  }
  if (document.addEventListener) document.addEventListener('click', function (event) {
    var button = event.target && event.target.closest && event.target.closest('[data-agents-run]');
    if (button && !button.disabled) runBuilds();
  });
  function setAgents(data) {
    agentsLive = data.agents_live === true;
    if (!agentsLive) { agentsFeed = null; return; }
    var fresh = data.agents_feed && typeof data.agents_feed === 'object' ? data.agents_feed : null;
    if (fresh && (!agentsFeed || !(Date.parse(agentsFeed.updated) > Date.parse(fresh.updated)))) agentsFeed = fresh;
    if (!agentsTimer && typeof setInterval === 'function') agentsTimer = setInterval(pollAgents, 5000);
  }
  function laneLine(lane, ref) {
    var tasks = objects(lane.now), label = lane.label || LABELS[lane.name] || lane.name, text;
    if (tasks.length) text = tasks.map(function (t) {
      var detail = [t.step, t.started ? 'since ' + whenLabel(t.started, ref) : ''].filter(Boolean).join(', ');
      return t.number + ' · ' + t.title + (detail ? ' (' + detail + ')' : '');
    }).join('; ');
    else {
      var extra = lane.note || (stateKey(lane.state) === 'out' ? outText(lane, ref) : '');
      text = 'nothing' + (extra ? ' · ' + extra : '');
    }
    var working = Number(lane.sessions_working) || 0;
    return label + ': ' + text + (working ? ' · ' + working + (working === 1 ? ' session' : ' sessions') + ' working' : '');
  }
  function renderAgentsCard(data) {
    var cardEl = document.getElementById('agents-card');
    if (!cardEl) return;
    var copy = data.agents && typeof data.agents === 'object' && !Array.isArray(data.agents) ? data.agents : null;
    cardEl.hidden = !copy || !!data.builds;
    if (cardEl.hidden) { cardEl.innerHTML = ''; return; }
    var ref = data.generated, line = function (text) { return '<p class="builder">' + esc(text) + '</p>'; };
    var needs = objects(copy.needs_ben), queue = objects(copy.queue).slice(0, 3);
    cardEl.innerHTML = head('Agents') + objects(copy.lanes).map(function (lane) { return line(laneLine(lane, ref)); }).join('') +
      (needs.length ? '<div class="sub-head">Needs you</div>' + needs.map(function (n) { return line(n.number + ' · ' + n.title + ': ' + (n.why || n.state || '')); }).join('') : '') +
      (queue.length ? '<div class="sub-head">Up next</div>' + queue.map(function (q) { return line(q.number + ' · ' + q.title); }).join('') : '');
  }
  function render(data) {
    setAgents(data);
    renderTop(data); renderToday(data); renderCalendar(data); renderSchool(data); renderCareer(data); renderHealth(data); renderBoard(data); renderBuilds(data);
    drawAgents(); renderAgentsCard(data);
    if (agentsLive && typeof location !== 'undefined' && location.hash === '#agents' && active !== 'agents') activate('agents', false, false);
    if (document.querySelectorAll) document.querySelectorAll('.panel').forEach(function(panel) {
      panel.querySelectorAll('.card,.tile').forEach(function(el,index) {el.style.setProperty('--order',index);});
      if (!panel.hidden) panel.classList.add('entering');
    });
  }
  window.BVOS_RENDER = render;
  navigation();
  function load() {
    if (window.BVOS_APP) return;
    if (window.BVOS_DATA) { render(window.BVOS_DATA); return; }
    var key = new URLSearchParams(location.search).get('key');
    fetch('data.json' + (key ? '?key=' + encodeURIComponent(key) : ''), {cache:'no-store'})
      .then(function(r) {if (!r.ok) throw new Error(r.status); return r.json();}).then(render)
      .catch(function() {document.getElementById('banner').innerHTML = '<div class="banner">Can’t reach BVOS. Start it with: python3 scripts/dashboard.py serve</div>';});
  }
  load();
  if (!window.BVOS_DATA && !window.BVOS_APP) {
    setInterval(load, REFRESH_MS);
    document.addEventListener('visibilitychange', function() {if (!document.hidden) load();});
  }
})();

<script>
/* BVOS app unlock: asks for the passphrase, decrypts data.enc.json in the browser
   (PBKDF2-SHA256 + AES-256-GCM, matching scripts/app_build.py) and renders the dashboard.
   "Remember on this device" keeps the derived key, never the passphrase, in localStorage. */
(function () {
  "use strict";
  var STORE = "bvos-key-v1";
  var REFRESH_MS = 10 * 60 * 1000;
  var box = null;

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  function load() {
    return fetch("data.enc.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("fetch " + r.status);
      return r.json();
    });
  }
  function keyFrom(pass, b) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(b.salt), iterations: b.rounds }, base, 256);
      });
  }
  function open(bits, b) {
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(b.iv) }, key, b64(b.data));
    }).then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }
  function saved() {
    try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
  }
  function remember(bits, b) {
    try { localStorage.setItem(STORE, JSON.stringify({ salt: b.salt, rounds: b.rounds, key: toB64(bits) })); } catch (e) { /* private mode */ }
  }
  function forget() { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } }

  var DRAW_FAILED = "BVOS couldn't show your data. Try again in a few minutes.";
  function whyFailed(e) {
    if (e && e.kind === "pass") return "That passphrase didn't work.";
    if (e && e.kind === "render") return DRAW_FAILED;
    if (/fetch/.test(String(e && e.message || e))) return "Can't reach BVOS. Check your connection.";
    return DRAW_FAILED;
  }
  // The passphrase was right if we got this far, so a failure here is never blamed on it.
  function showOrExplain(data) {
    try {
      show(data);
    } catch (e) {
      console.error("BVOS render failed:", e);
      var wrap = document.querySelector(".wrap"), gate = document.getElementById("gate");
      if (wrap) wrap.hidden = true;
      if (gate) gate.hidden = false;
      throw { kind: "render" };
    }
  }

  function show(data) {
    var gate = document.getElementById("gate");
    if (gate) gate.hidden = true;
    document.querySelector(".wrap").hidden = false;
    data.banner = "";
    window.BVOS_RENDER(data);
  }

  // A remembered key only works while the salt matches; each build makes a new salt,
  // so the key is stored with the salt and re-derived from the passphrase when it changes.
  function tryRemembered(b) {
    var s = saved();
    if (!s || s.salt !== b.salt || s.rounds !== b.rounds) return Promise.reject(new Error("no key"));
    return open(b64(s.key).buffer, b);
  }

  function gateUI() {
    var wrap = document.querySelector(".wrap");
    wrap.hidden = true;
    var gate = document.createElement("form");
    gate.id = "gate";
    gate.className = "gate";
    gate.innerHTML =
      '<div class="gate-card">' +
      '<div class="mark">BVOS</div>' +
      '<label class="gate-label" for="pass">Passphrase</label>' +
      '<input id="pass" class="gate-input" type="password" autocomplete="current-password" required>' +
      '<label class="gate-check"><input id="keep" type="checkbox" checked> Remember on this device</label>' +
      '<button class="gate-button" type="submit">Unlock</button>' +
      '<div class="gate-error" id="gate-error" role="alert"></div>' +
      "</div>";
    document.body.insertBefore(gate, wrap);
    gate.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pass = document.getElementById("pass").value;
      var err = document.getElementById("gate-error");
      err.textContent = "Unlocking…";
      (box ? Promise.resolve(box) : load()).then(function (b) {
        box = b;
        return keyFrom(pass, b).then(function (bits) {
          return open(bits, b).catch(function () { throw { kind: "pass" }; }).then(function (data) {
            if (document.getElementById("keep").checked) remember(bits, b); else forget();
            sessionPass = pass;
            showOrExplain(data);
          });
        });
      }).catch(function (e) {
        err.textContent = whyFailed(e);
      });
    });
    document.getElementById("pass").focus();
  }

  var sessionPass = null;
  function refresh() {
    load().then(function (b) {
      if (box && b.data === box.data) return;
      box = b;
      return tryRemembered(b).catch(function () {
        if (!sessionPass) throw new Error("locked");
        return keyFrom(sessionPass, b).then(function (bits) {
          if (saved()) remember(bits, b);
          return open(bits, b);
        });
      }).then(function (data) { try { show(data); } catch (e) { console.error("BVOS render failed:", e); } });
    }).catch(function () { /* keep what's on screen */ });
  }

  var css = document.createElement("style");
  css.textContent =
    ".gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}" +
    ".gate[hidden]{display:none}" +
    ".gate-card{width:100%;max-width:340px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:24px;display:grid;gap:12px}" +
    ".gate-label{font-size:12px;color:var(--text);margin-top:8px}" +
    ".gate-input{height:40px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--well);color:var(--text-strong);padding:0 12px;font:inherit}" +
    ".gate-input:focus-visible,.gate-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}" +
    ".gate-check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}" +
    ".gate-button{height:40px;border:0;border-radius:var(--radius-sm);background:var(--text-strong);color:var(--surface);font:600 14px var(--font);cursor:pointer}" +
    ".gate-error{min-height:18px;font-size:13px;color:var(--danger-text)}";
  document.head.appendChild(css);

  load().then(function (b) {
    box = b;
    return tryRemembered(b).then(function (data) {
      try {
        show(data);
      } catch (e) {
        console.error("BVOS render failed:", e);
        gateUI();
        document.getElementById("gate-error").textContent = DRAW_FAILED;
      }
    });
  }).catch(function () {
    gateUI();
  });
  setInterval(refresh, REFRESH_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();

</script>
